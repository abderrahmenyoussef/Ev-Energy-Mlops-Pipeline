name: CI/CD Pipeline (EV Energy)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-ev-energy-mlops
  ACR_NAME: acrevenergyabdou14885
  CONTAINER_APP_NAME: app-ev-energy-api
  IMAGE_NAME: ev-energy-api

jobs:
  # ========================================
  # Backend Tests (FastAPI)
  # ========================================
  test-backend:
    name: 🔧 Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests
        run: |
          pytest tests/test_smoke.py -v --cov=app --cov-report=term

  # ========================================
  # Frontend Tests (Streamlit)
  # ========================================
  test-frontend:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit_app/requirements.txt
          pip install pytest ruff

      - name: Lint Streamlit code with Ruff
        run: |
          ruff check streamlit_app/ --ignore=E501,F401 --exit-zero
        continue-on-error: true

      - name: Run frontend tests
        run: |
          pytest tests/test_streamlit_app.py -v

      - name: Verify Streamlit app can start
        run: |
          cd streamlit_app
          timeout 10 streamlit run app.py --server.headless=true --server.port=8501 &
          sleep 5
          curl -s http://localhost:8501/_stcore/health | grep -q "ok" && echo "✅ Streamlit app started successfully" || echo "⚠️ Streamlit health check skipped"
        continue-on-error: true

  # ========================================
  # Security Scan
  # ========================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety

      - name: Check backend dependencies
        run: safety check -r requirements.txt --output text || true
        continue-on-error: true

      - name: Check frontend dependencies
        run: safety check -r streamlit_app/requirements.txt --output text || true
        continue-on-error: true

  # ========================================
  # Build and Deploy Backend
  # ========================================
  build-and-deploy:
    name: 🚀 Deploy Backend
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployment
        uses: azure/CLI@v1
        with:
          inlineScript: |
            APP_FQDN=$(az containerapp show \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "APP URL: https://$APP_FQDN"
            sleep 20
            curl -f https://$APP_FQDN/ || exit 1
            curl -f https://$APP_FQDN/health || exit 1
            echo "✅ Deployment OK"
