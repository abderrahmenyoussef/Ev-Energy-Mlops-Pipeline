# .streamlit/config.toml
# Streamlit configuration

[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
runOnSave = true
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
